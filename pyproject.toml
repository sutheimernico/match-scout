[project]
name = "match-scout"
version = "0.1.0"
description = "Local, free, paper-only football match prediction + betting-slip simulation — honest measurement, no edge promise."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",   # match/odds tables, season CSV wrangling
    "numpy>=1.26",   # numerics for the goal model
    "pyarrow>=16",   # Parquet cache format
    "httpx>=0.27",   # data fetch (football-data.co.uk CSVs, football-data.org API)
    "typer>=0.12",   # CLI entry points under scripts/
    "scipy>=1.13",   # MLE optimization for the Dixon-Coles / Poisson goal model
    "lightgbm>=4.0", # walled-off ML challenger (must beat Dixon-Coles AND the closing line)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matchscout"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
